# C++ HTTP Server Configuration
# Environment variables can override these settings

# Server settings
SERVER_PORT=8080
THREAD_POOL_SIZE=4

# Logging settings
LOG_LEVEL=INFO
LOG_FILE=logs/server.log

# Database settings
DB_PATH=data/server.db

# Security settings
RSA_PRIVATE_KEY=config/privateKey.pem
RSA_PUBLIC_KEY=config/publicKey.pem
BCRYPT_ROUNDS=12

# Performance settings
MAX_CONNECTIONS=1000
TIMEOUT_SECONDS=30
