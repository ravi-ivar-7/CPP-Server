<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C++ HTTP Server - Modern & Powerful</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary-color: #7c3aed;
            --accent-color: #059669;
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-card: #ffffff;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --text-muted: #9ca3af;
            --border-color: #e5e7eb;
            --shadow-light: rgba(37, 99, 235, 0.1);
            --shadow-medium: rgba(0, 0, 0, 0.1);
            --gradient-primary: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            --gradient-accent: linear-gradient(135deg, var(--accent-color), #10b981);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
            z-index: 1000;
            box-shadow: 0 2px 10px var(--shadow-medium);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--text-primary);
        }

        .logo i {
            color: var(--primary-color);
            font-size: 1.5rem;
        }

        .menu-toggle {
            display: none;
            background: var(--gradient-primary);
            border: none;
            color: white;
            padding: 0.75rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .menu-toggle:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--shadow-light);
        }

        .sidebar {
            position: fixed;
            top: 70px;
            left: 0;
            width: 280px;
            height: calc(100vh - 70px);
            background: var(--bg-card);
            border-right: 1px solid var(--border-color);
            padding: 2rem 0;
            overflow-y: auto;
            transition: transform 0.3s ease;
            z-index: 999;
            box-shadow: 2px 0 10px var(--shadow-medium);
        }

        .sidebar.hidden {
            transform: translateX(-100%);
        }

        .nav-section {
            margin-bottom: 2rem;
        }

        .nav-title {
            padding: 0 1.5rem;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-bottom: 0.75rem;
        }

        .nav-item {
            display: flex;
            align-items: center;
            padding: 0.75rem 1.5rem;
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            border-left: 3px solid transparent;
        }

        .nav-item:hover {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border-left-color: var(--primary-color);
        }

        .nav-item.active {
            background: var(--gradient-primary);
            color: white;
            border-left-color: var(--accent-color);
        }

        .nav-item i {
            width: 20px;
            margin-right: 0.75rem;
            font-size: 1rem;
        }

        .main-content {
            margin-left: 280px;
            margin-top: 70px;
            min-height: calc(100vh - 70px);
            padding: 2rem;
            transition: margin-left 0.3s ease;
        }

        .main-content.expanded {
            margin-left: 0;
        }

        .content-header {
            margin-bottom: 2rem;
        }

        .content-title {
            font-size: 2.5rem;
            font-weight: 700;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .content-subtitle {
            color: var(--text-secondary);
            font-size: 1.125rem;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 20px var(--shadow-medium);
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 40px var(--shadow-medium);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .card-icon {
            width: 48px;
            height: 48px;
            background: var(--gradient-primary);
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.25rem;
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .card-content {
            color: var(--text-secondary);
            line-height: 1.7;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 0.5rem;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.875rem;
        }

        .btn-primary {
            background: var(--gradient-primary);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--shadow-light);
        }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--bg-secondary);
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .feature-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            padding: 1.5rem;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px var(--shadow-medium);
        }

        .feature-card:hover {
            transform: translateY(-2px);
            border-color: var(--primary-color);
            box-shadow: 0 4px 16px var(--shadow-medium);
        }

        .feature-icon {
            width: 48px;
            height: 48px;
            background: var(--gradient-accent);
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            margin-bottom: 1rem;
            font-size: 1.25rem;
        }

        .feature-title {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            color: var(--text-primary);
            line-height: 1.4;
        }

        .feature-description {
            color: var(--text-secondary);
            font-size: 0.875rem;
            line-height: 1.6;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .feature-content {
            flex: 1;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
        }

        .readme-content {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
        }

        .readme-content h4 {
            color: var(--text-primary);
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .markdown-content {
            color: var(--text-secondary);
            line-height: 1.7;
        }

        .markdown-content h1,
        .markdown-content h2,
        .markdown-content h3,
        .markdown-content h4,
        .markdown-content h5,
        .markdown-content h6 {
            color: var(--text-primary);
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
        }

        .markdown-content p {
            margin-bottom: 1rem;
        }

        .markdown-content ul,
        .markdown-content ol {
            margin-bottom: 1rem;
            padding-left: 1.5rem;
        }

        .markdown-content li {
            margin-bottom: 0.5rem;
        }

        .markdown-content code {
            background: var(--bg-secondary);
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            font-size: 0.875rem;
            color: var(--primary-color);
        }

        .markdown-content pre {
            background: var(--bg-secondary);
            padding: 1rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            margin-bottom: 1rem;
        }

        .markdown-content blockquote {
            border-left: 4px solid var(--primary-color);
            padding-left: 1rem;
            margin: 1rem 0;
            font-style: italic;
            color: var(--text-muted);
        }

        @media (max-width: 1024px) {
            .sidebar {
                transform: translateX(-100%);
            }

            .sidebar.show {
                transform: translateX(0);
            }

            .main-content {
                margin-left: 0;
            }

            .menu-toggle {
                display: block;
            }
        }

        @media (max-width: 768px) {
            .header {
                padding: 0 1rem;
            }

            .main-content {
                padding: 1rem;
            }

            .content-title {
                font-size: 2rem;
            }

            .card {
                padding: 1.5rem;
            }

            .feature-grid,
            .features-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }

            .feature-card {
                padding: 1.25rem;
            }

            .actions {
                flex-direction: column;
            }

            .actions .btn {
                width: 100%;
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            .feature-grid,
            .features-grid {
                grid-template-columns: 1fr;
                gap: 0.75rem;
            }

            .feature-card {
                padding: 1rem;
            }

            .feature-icon {
                width: 40px;
                height: 40px;
                font-size: 1rem;
            }

            .feature-title {
                font-size: 1rem;
            }

            .feature-description {
                font-size: 0.8rem;
            }
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            color: var(--text-muted);
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border-color);
            border-top: 2px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 0.5rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.6s ease-out;
        }
    </style>
</head>

<body>

    <header class="header">
        <div class="logo">
            <i class="fas fa-server"></i>
            <span>C++ HTTP Server</span>
        </div>
        <button class="menu-toggle" onclick="toggleSidebar()">
            <i class="fas fa-bars"></i>
        </button>
    </header>

    <nav class="sidebar" id="sidebar">
        <div class="nav-section">
            <div class="nav-title">Overview</div>
            <a href="#home" class="nav-item active" data-module="home">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>
            <a href="#health" class="nav-item" data-module="health">
                <i class="fas fa-heartbeat"></i>
                <span>Health Check</span>
            </a>
        </div>
        
        <div class="nav-section">
            <div class="nav-title">Core Modules</div>
            <a href="#auth" class="nav-item" data-module="auth">
                <i class="fas fa-shield-alt"></i>
                <span>Authentication</span>
            </a>
            <a href="#security" class="nav-item" data-module="security">
                <i class="fas fa-lock"></i>
                <span>Security & Encryption</span>
            </a>
            <a href="#databases" class="nav-item" data-module="databases">
                <i class="fas fa-database"></i>
                <span>Database</span>
            </a>
            <a href="#files" class="nav-item" data-module="files">
                <i class="fas fa-file-alt"></i>
                <span>File Management</span>
            </a>
        </div>
        
        <div class="nav-section">
            <div class="nav-title">Communication</div>
            <a href="#requests" class="nav-item" data-module="requests">
                <i class="fas fa-exchange-alt"></i>
                <span>HTTP Proxy</span>
            </a>
            <a href="#websocket" class="nav-item" data-module="websocket">
                <i class="fas fa-plug"></i>
                <span>WebSocket Utils</span>
            </a>
            <a href="#stream" class="nav-item" data-module="stream">
                <i class="fas fa-stream"></i>
                <span>Real-Time Streaming</span>
            </a>
        </div>
        
        <div class="nav-section">
            <div class="nav-title">System</div>
            <a href="#system" class="nav-item" data-module="system">
                <i class="fas fa-cogs"></i>
                <span>System Info</span>
            </a>
            <a href="#routes" class="nav-item" data-module="routes">
                <i class="fas fa-route"></i>
                <span>Routing</span>
            </a>
            <a href="#client" class="nav-item" data-module="client">
                <i class="fas fa-desktop"></i>
                <span>HTML Rendering</span>
            </a>
        </div>
        
        <div class="nav-section">
            <div class="nav-title">About</div>
            <a href="#author" class="nav-item" data-module="author">
                <i class="fas fa-user-circle"></i>
                <span>Author</span>
            </a>
        </div>
    </nav>

    <main class="main-content" id="mainContent">
        
        <div id="contentArea">
            <div class="loading">
                <div class="spinner"></div>
                Loading content...
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        // Module configuration with README file paths
        const moduleConfig = {
            home: {
                title: 'C++ HTTP Server',
                description: 'A modern, high-performance HTTP server built with C++ using Boost.Asio and Boost.Beast libraries.',
                readmePath: '/README.md',
                features: [
                    { icon: 'fas fa-rocket', title: 'High Performance', description: 'Built with C++ for maximum speed and efficiency' },
                    { icon: 'fas fa-shield-alt', title: 'Secure', description: 'RSA encryption, bcrypt hashing, and secure authentication' },
                    { icon: 'fas fa-cogs', title: 'Modular', description: 'Clean, organized architecture with separate modules' },
                    { icon: 'fas fa-plug', title: 'WebSocket Support', description: 'Real-time communication with WebSocket connections' }
                ],
                actions: [
                    { text: 'View Health Status', url: '/health', icon: 'fas fa-heartbeat' },
                    { text: 'System Information', url: '/sys-server-info?sysInfo=true', icon: 'fas fa-info-circle' }
                ]
            },
            health: {
                title: 'Health Check',
                description: 'Monitor server health, uptime, and system metrics in real-time.',
                actions: [
                    { text: 'Check Server Health', url: '/health', icon: 'fas fa-heartbeat' }
                ]
            },
            auth: {
                title: 'Authentication Module',
                description: 'Handle user authentication using secure password hashing with bcrypt.',
                readmePath: '/src/auth/readme.md'
            },
            security: {
                title: 'Security & Encryption Module',
                description: 'Military-grade encryption and decryption services using RSA algorithms.',
                readmePath: '/src/security/readme.md'
            },
            databases: {
                title: 'Database Module',
                description: 'Simple and reliable SQLite database operations for C++ applications.',
                readmePath: '/src/databases/readme.md'
            },
            files: {
                title: 'File Management Module',
                description: 'Handle file upload and download operations with security and ease.',
                readmePath: '/src/files/readme.md'
            },
            requests: {
                title: 'HTTP Request Proxy Module',
                description: 'Proxy HTTP requests to external APIs while keeping credentials secure.',
                readmePath: '/src/requests/readme.md'
            },
            websocket: {
                title: 'WebSocket Utilities Module',
                description: 'Essential utilities for managing WebSocket connections in applications.',
                readmePath: '/src/websocket/readme.md'
            },
            stream: {
                title: 'Real-Time Streaming Module',
                description: 'Real-time communication through WebSocket connections for chat and live updates.',
                readmePath: '/src/stream/readme.md',
                actions: [
                    { text: 'Start Text Stream', url: 'render-html?filePath=templates/stream_text.html', icon: 'fas fa-comments' }
                ]
            },
            system: {
                title: 'System Information Module',
                description: 'Complete visibility into server health and performance metrics.',
                readmePath: '/src/system/readme.md',
                actions: [
                    { text: 'View System Info', url: '/sys-server-info?sysInfo=true', icon: 'fas fa-chart-line' }
                ]
            },
            routes: {
                title: 'Routing Module',
                description: 'Traffic controller that directs requests to appropriate handlers.',
                readmePath: '/src/routes/readme.md'
            },
            client: {
                title: 'HTML Rendering Module',
                description: 'Serve HTML files dynamically for web interfaces and content.',
                readmePath: '/src/client/readme.md'
            },
            author: {
                title: 'About the Author',
                description: 'Learn about the developer behind this C++ HTTP Server project.',
                readmePath: '/AUTHOR.md'
            }
        };

        async function showContent(module) {
            const contentArea = document.getElementById('contentArea');
            const config = moduleConfig[module];
            
            if (!config) {
                contentArea.innerHTML = '<div class="card"><p>Content not found for this module.</p></div>';
                return;
            }

            // Update active navigation
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });
            document.querySelector(`[data-module="${module}"]`).classList.add('active');

            // Show loading state
            contentArea.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    Loading ${config.title}...
                </div>
            `;

            try {
                let html = `
                    <div class="card">
                        <div class="card-header">
                            <div class="card-title">${config.title}</div>
                        </div>
                        <div class="card-content">
                            <p class="description">${config.description}</p>
                `;

                // If module has a README file, fetch and render it
                if (config.readmePath) {
                    try {
                        const response = await fetch(`/render-file?filePath=${config.readmePath.substring(1)}`);
                        if (response.ok) {
                            const readmeContent = await response.text();
                            // Convert markdown to HTML
                            const htmlContent = marked.parse(readmeContent);
                            html += `
                                <div class="readme-content">
                                    <div class="markdown-content">${htmlContent}</div>
                                </div>
                            `;
                        } else {
                            html += `<p><em>README file not available for this module.</em></p>`;
                        }
                    } catch (error) {
                        html += `<p><em>Error loading README: ${error.message}</em></p>`;
                    }
                }

                // Add features if available
                if (config.features) {
                    html += `
                        <div class="features-grid">
                            ${config.features.map(feature => `
                                <div class="feature-card">
                                    <div class="feature-icon"><i class="${feature.icon}"></i></div>
                                    <div class="feature-content">
                                        <h4>${feature.title}</h4>
                                        <p>${feature.description}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `;
                }

                // Add action buttons if available
                if (config.actions) {
                    html += `
                        <div class="actions">
                            ${config.actions.map(action => `
                                <a href="${action.url}" target="_blank" class="btn btn-primary">
                                    <i class="${action.icon}"></i>
                                    ${action.text}
                                </a>
                            `).join('')}
                        </div>
                    `;
                }

                html += `
                        </div>
                    </div>
                `;

                contentArea.innerHTML = html;
            } catch (error) {
                contentArea.innerHTML = `
                    <div class="card">
                        <div class="card-content">
                            <p>Error loading content: ${error.message}</p>
                        </div>
                    </div>
                `;
            }
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.getElementById('mainContent');
            
            if (window.innerWidth <= 1024) {
                sidebar.classList.toggle('show');
            } else {
                sidebar.classList.toggle('hidden');
                mainContent.classList.toggle('expanded');
            }
        }

        // Event listeners
        document.addEventListener('DOMContentLoaded', () => {
            // Navigation click handlers
            document.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    e.preventDefault();
                    const module = item.getAttribute('data-module');
                    showContent(module);
                    
                    // Close sidebar on mobile after selection
                    if (window.innerWidth <= 1024) {
                        document.getElementById('sidebar').classList.remove('show');
                    }
                });
            });

            // Show home content by default
            showContent('home');

            // Handle window resize
            window.addEventListener('resize', () => {
                const sidebar = document.getElementById('sidebar');
                const mainContent = document.getElementById('mainContent');
                
                if (window.innerWidth > 1024) {
                    sidebar.classList.remove('show');
                    if (sidebar.classList.contains('hidden')) {
                        mainContent.classList.add('expanded');
                    } else {
                        mainContent.classList.remove('expanded');
                    }
                } else {
                    sidebar.classList.remove('hidden');
                    mainContent.classList.remove('expanded');
                }
            });
        });
    </script>
</body>
</html>
